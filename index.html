<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP YouTube 頻道與回放系統</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #0f0f0f;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------------- 1. 登入與註冊畫面 ---------------- */
        .auth-container {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            color: #fff;
            display: none;
        }

        .card.active {
            display: block;
        }

        .card h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: #ff0000;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-size: 16px;
            color: #fff;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .yt-red-btn {
            background: #ff0000;
            color: white;
        }
        .yt-red-btn:hover { background: #cc0000; }

        .extra-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        .extra-links a {
            color: #3ea6ff;
            text-decoration: none;
            cursor: pointer;
        }

        /* ---------------- 2. YouTube 主畫面 ---------------- */
        #youtubeApp {
            display: none;
            height: 100vh;
            flex-direction: column;
        }
        #youtubeApp.active {
            display: flex;
        }

        header {
            height: 56px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
        }
        .logo span {
            background: #ff0000;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
            margin-left: 2px;
        }

        .search-box {
            display: flex;
            width: 400px;
            background: #f8f8f8;
            border: 1px solid #ccc;
            border-radius: 40px 0 0 40px;
            overflow: hidden;
        }
        .search-box input {
            width: 100%;
            padding: 8px 16px;
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
        }
        .search-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-left: none;
            padding: 0 20px;
            border-radius: 0 40px 40px 0;
            cursor: pointer;
        }

        .create-btn {
            background: #f2f2f2;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
        }
        .create-btn:hover { background: #e5e5e5; }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        sidebar {
            width: 240px;
            background: #ffffff;
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .sidebar-item:hover, .sidebar-item.active {
            background: #f2f2f2;
        }

        content-area {
            flex: 1;
            background: #f9f9f9;
            padding: 24px;
            overflow-y: auto;
        }

        .tags-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .tag {
            background: #e5e5e5;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .tag.active {
            background: #0f0f0f;
            color: white;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .video-card {
            cursor: pointer;
            position: relative;
        }
        .live-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #cc0000;
            color: white;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 10;
        }
        .vod-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #606060;
            color: white;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 10;
        }
        .thumbnail {
            width: 100%;
            height: 160px;
            background: #ddd;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            margin-bottom: 12px;
        }
        .video-info-box {
            display: flex;
            gap: 12px;
        }
        .channel-avatar {
            width: 36px;
            height: 36px;
            background: #ccc;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .video-details h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #0f0f0f;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-details p {
            font-size: 12px;
            color: #606060;
        }

        /* ---------------- 3. 創作者頻道頁面 ---------------- */
        #channelProfilePanel {
            display: none;
            padding: 20px;
            background: #fff;
            height: 100%;
            overflow-y: auto;
            border-radius: 8px;
        }
        #channelProfilePanel.active {
            display: block;
        }
        .channel-banner {
            width: 100%;
            height: 150px;
            background: linear-gradient(to right, #302b63, #24243e);
            border-radius: 12px;
        }
        .channel-header-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .channel-big-avatar {
            width: 80px;
            height: 80px;
            background: #ff0000;
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }
        .join-member-btn {
            background: #000;
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-left: auto;
        }
        .join-member-btn.joined {
            background: #ccc;
            color: #333;
            border: 2px solid #ccc;
            cursor: default;
        }

        /* ---------------- 4. Studio 直播管理與播放視窗 ---------------- */
        #liveManagerPanel {
            display: none;
            padding: 20px;
            background: #fff;
            height: 100%;
            overflow-y: auto;
            border-radius: 8px;
        }
        #liveManagerPanel.active {
            display: block;
        }
        .manager-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .manager-table th, .manager-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        .manager-table th { background-color: #f2f2f2; }
        .action-end-btn {
            background: #ff4e45;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .action-end-btn:hover { background: #cc0000; }

        #videoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: #fff;
            width: 950px;
            max-width: 95%;
            max-height: 90vh;
            border-radius: 12px;
            padding: 20px;
            color: #0f0f0f;
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .modal-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .exit-btn {
            background: #ff4e45;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .exit-btn:hover { background: #cc0000; }

        .player-chat-layout {
            display: flex;
            gap: 20px;
        }
        .player-side {
            flex: 2;
        }
        .player-side video {
            width: 100%;
            height: 360px;
            background: #000;
            border-radius: 8px;
        }

        .chat-side {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 420px;
            background: #f9f9f9;
        }
        .chat-header {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            font-weight: bold;
            font-size: 14px;
            background: #fff;
            border-radius: 8px 8px 0 0;
        }
        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }
        .chat-input-box {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
            background: #fff;
            border-radius: 0 0 8px 8px;
        }
        .chat-input-box input {
            flex: 1;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .chat-input-box button {
            padding: 6px 12px;
            background: #065fd4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }

        .comments-section {
            margin-top: 20px;
        }
        .comment-box {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        .comment-box input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .comment-box button {
            padding: 8px 16px;
            background: #065fd4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .comment-item {
            font-size: 14px;
            background: #f2f2f2;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- 登入畫面 -->
    <div class="auth-container" id="authContainer">
        <div id="loginCard" class="card active">
            <h2>VIP 影音登入</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>會員帳號 (頻道名稱)</label>
                    <input type="text" id="username" placeholder="輸入您的帳號" required>
                </div>
                <div class="input-group">
                    <label>密碼</label>
                    <input type="password" id="password" placeholder="輸入密碼" required>
                </div>
                <button type="submit" class="btn yt-red-btn">立即登入</button>
                <div class="extra-links">
                    <a onclick="switchAuth('registerCard')">沒有帳號？註冊新會員</a>
                </div>
            </form>
        </div>

        <div id="registerCard" class="card">
            <h2>註冊 VIP 會員</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label>設定帳號</label>
                    <input type="text" id="regUsername" placeholder="輸入欲使用的帳號" required>
                </div>
                <div class="input-group">
                    <label>設定密碼</label>
                    <input type="password" id="regPassword" placeholder="輸入密碼" required>
                </div>
                <button type="submit" class="btn yt-red-btn">完成註冊</button>
                <div class="extra-links">
                    <a onclick="switchAuth('loginCard')">已有帳號？返回登入</a>
                </div>
            </form>
        </div>
    </div>

    <!-- YouTube 主畫面 -->
    <div id="youtubeApp">
        <header>
            <div class="header-left">
                <div class="logo" onclick="switchTab('home', document.querySelector('.sidebar-item'))">You<span>Tube</span></div>
            </div>
            <div class="header-center" style="display: flex;">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜尋" oninput="searchVideos()">
                </div>
                <button class="search-btn">🔍</button>
            </div>
            <div class="header-right">
                <span id="currentUserDisplay" style="font-size: 14px; font-weight: bold; color: #666;"></span>
                <button class="create-btn" onclick="openCreateModal()">＋ 上傳影片</button>
                <button class="create-btn" onclick="startLiveModal()">📡 開啟直播 (分享視窗)</button>
                <button class="create-btn" onclick="openLiveManager()" style="background:#282828; color:white;">Studio 直播管理</button>
                <button class="create-btn" onclick="logout()" style="background:#ff4e45; color:white;">登出</button>
            </div>
        </header>

        <div class="main-layout">
            <sidebar>
                <div class="sidebar-item active" onclick="switchTab('home', this)">🏠 首頁</div>
                <div class="sidebar-item" onclick="switchTab('liveList', this)">🔴 直播中</div>
                <div class="sidebar-item" onclick="openLiveManager()">🎛️ Studio 直播管理</div>
            </sidebar>

            <content-area>
                <!-- 1. 首頁/影片清單畫面 -->
                <div id="homeContent">
                    <div class="tags-bar">
                        <div class="tag active" onclick="filterCategory('全部', this)">全部</div>
                        <div class="tag" onclick="filterCategory('直播中', this)">🔴 直播中</div>
                        <div class="tag" onclick="filterCategory('回放', this)">回放 (VOD)</div>
                        <div class="tag" onclick="filterCategory('遊戲', this)">遊戲</div>
                        <div class="tag" onclick="filterCategory('音樂', this)">音樂</div>
                    </div>
                    <div class="video-grid" id="videoGrid"></div>
                </div>

                <!-- 2. 創作者頻道頁面 -->
                <div id="channelProfilePanel">
                    <div class="channel-banner"></div>
                    <div class="channel-header-info">
                        <div class="channel-big-avatar" id="channelBigAvatar">頻道</div>
                        <div>
                            <h2 id="channelProfileName" style="font-size: 24px;">頻道名稱</h2>
                            <p style="color: #606060; font-size: 14px; margin-top: 4px;">已訂閱 • 專屬創作者頻道</p>
                        </div>
                        <button class="join-member-btn" id="joinMemberBtn" onclick="toggleChannelMembership()">加入頻道會員 🌟</button>
                    </div>
                    <hr style="border:0; border-top:1px solid #ddd; margin-bottom: 20px;">
                    <h3 style="margin-bottom: 15px; font-size: 18px;">此創作者的所有影片與直播</h3>
                    <div class="video-grid" id="channelVideoGrid"></div>
                </div>

                <!-- 3. Studio 直播管理後台 -->
                <div id="liveManagerPanel">
                    <h2 style="font-size: 22px; color: #0f0f0f; margin-bottom: 5px;">YouTube Studio 直播管理</h2>
                    <p style="color: #606060; font-size: 14px; margin-bottom: 20px;">這裡僅會顯示您（<span id="managerAccountName" style="color:#ff0000; font-weight:bold;"></span>）親自開啟的直播。</p>
                    <table class="manager-table">
                        <thead>
                            <tr>
                                <th>直播標題</th>
                                <th>頻道擁有者</th>
                                <th>狀態</th>
                                <th>操作控制</th>
                            </tr>
                        </thead>
                        <tbody id="managerTableBody"></tbody>
                    </table>
                </div>
            </content-area>
        </div>
    </div>

    <!-- 播放與直播視窗 -->
    <div id="videoModal">
        <div class="modal-content">
            <div class="modal-top-bar">
                <h2 id="modalTitle" style="font-size: 18px;">標題</h2>
                <button class="exit-btn" onclick="closeModal()">✕ 離開</button>
            </div>

            <div class="player-chat-layout">
                <div class="player-side">
                    <video id="modalVideoPlayer" controls autoplay loop style="display:block;">
                        <source id="videoSource" src="" type="video/mp4">
                    </video>
                    <video id="windowSharePlayer" autoplay playsinline muted style="display:none; width:100%; height:360px; background:#000; border-radius:8px;"></video>
                    
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px;">
                        <p id="modalInfo" style="color: #606060; font-size: 14px; cursor: pointer; text-decoration: underline;" onclick="openChannelProfile(currentVideo.channel)"></p>
                        <button class="join-member-btn" id="modalJoinBtn" style="margin: 0; padding: 6px 14px; font-size: 13px;" onclick="toggleChannelMembership()">加入頻道會員 🌟</button>
                    </div>
                </div>

                <!-- 直播聊天室 -->
                <div class="chat-side" id="chatSide" style="display: none;">
                    <div class="chat-header">即時聊天室 💬</div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-box">
                        <input type="text" id="chatInput" placeholder="傳送訊息..." onkeypress="if(event.key==='Enter') sendLiveChat()">
                        <button onclick="sendLiveChat()">發布</button>
                    </div>
                </div>
            </div>

            <!-- 一般影片與回放留言區 -->
            <div class="comments-section" id="commentsSection">
                <h3 style="font-size: 15px; margin-bottom: 10px;">留言區</h3>
                <div class="comment-box">
                    <input type="text" id="commentInput" placeholder="留下您的評論..." onkeypress="if(event.key==='Enter') addComment()">
                    <button onclick="addComment()">發布</button>
                </div>
                <div id="commentList"></div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="video/mp4" style="display: none;" onchange="handleFileSelected(event)">

    <script>
        if (!localStorage.getItem('yt_videos')) {
            let defaultVideos = [
                { id: 1, title: "【Minecraft】新手生存冒險，第一集露臉！", category: "遊戲", channel: "紅月", views: "38萬次", isLive: false, isVOD: false, src: "https://www.w3schools.com/html/movie.mp4", thumb: "https://picsum.photos/300/160?random=2" }
            ];
            localStorage.setItem('yt_videos', JSON.stringify(defaultVideos));
        }

        if (!localStorage.getItem('yt_comments')) localStorage.setItem('yt_comments', JSON.stringify({}));
        if (!localStorage.getItem('yt_chats')) localStorage.setItem('yt_chats', JSON.stringify({}));
        if (!localStorage.getItem('yt_users')) localStorage.setItem('yt_users', JSON.stringify({}));
        if (!localStorage.getItem('yt_memberships')) localStorage.setItem('yt_memberships', JSON.stringify({})); // 記錄會員

        let loggedInUser = "";
        let currentVideo = null;
        let activeWindowStream = null;
        let recordedBlobUrl = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let viewingChannelName = "";

        function getVideos() { return JSON.parse(localStorage.getItem('yt_videos')); }
        function saveVideos(v) { localStorage.setItem('yt_videos', JSON.stringify(v)); }
        function getComments() { return JSON.parse(localStorage.getItem('yt_comments')); }
        function saveComments(c) { localStorage.setItem('yt_comments', JSON.stringify(c)); }
        function getChats() { return JSON.parse(localStorage.getItem('yt_chats')); }
        function saveChats(ch) { localStorage.setItem('yt_chats', JSON.stringify(ch)); }
        function getMemberships() { return JSON.parse(localStorage.getItem('yt_memberships')); }
        function saveMemberships(m) { localStorage.setItem('yt_memberships', JSON.stringify(m)); }

        function renderVideos(list, containerId = 'videoGrid') {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            if(list.length === 0) {
                grid.innerHTML = `<p style="color:#888;">這裡目前沒有影片。</p>`;
                return;
            }
            list.forEach(v => {
                let badge = '';
                if (v.isLive) badge = `<div class="live-badge">LIVE</div>`;
                else if (v.isVOD) badge = `<div class="vod-badge">回放</div>`;

                grid.innerHTML += `
                    <div class="video-card" onclick="openVideo(${v.id})">
                        <div class="thumbnail" style="background-image: url('${v.thumb}')">
                            ${badge}
                        </div>
                        <div class="video-info-box">
                            <div class="channel-avatar" onclick="event.stopPropagation(); openChannelProfile('${v.channel}')"></div>
                            <div class="video-details">
                                <h4>${v.title}</h4>
                                <p onclick="event.stopPropagation(); openChannelProfile('${v.channel}')" style="cursor:pointer; color:#065fd4;">${v.channel}</p>
                                <p>${v.views}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let u = document.getElementById('regUsername').value.trim();
            let p = document.getElementById('regPassword').value.trim();
            let users = JSON.parse(localStorage.getItem('yt_users'));
            if(users[u]) { alert('此帳號已被註冊！'); }
            else {
                users[u] = p;
                localStorage.setItem('yt_users', JSON.stringify(users));
                alert('註冊成功！請登入');
                switchAuth('loginCard');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            loggedInUser = document.getElementById('username').value.trim();
            document.getElementById('currentUserDisplay').textContent = `👤 ${loggedInUser}`;
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('youtubeApp').classList.add('active');
            renderVideos(getVideos());
        });

        function switchAuth(cardId) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById(cardId).classList.add('active');
        }

        function logout() {
            document.getElementById('youtubeApp').classList.remove('active');
            document.getElementById('authContainer').style.display = 'flex';
        }

        function switchTab(tab, element) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            document.getElementById('homeContent').style.display = 'block';
            document.getElementById('channelProfilePanel').style.display = 'none';
            document.getElementById('liveManagerPanel').style.display = 'none';

            if(tab === 'home') renderVideos(getVideos());
            if(tab === 'liveList') renderVideos(getVideos().filter(v => v.isLive));
        }

        // 開啟創作者頻道頁面
        function openChannelProfile(channelName) {
            document.getElementById('homeContent').style.display = 'none';
            document.getElementById('liveManagerPanel').style.display = 'none';
            document.getElementById('channelProfilePanel').style.display = 'block';

            viewingChannelName = channelName;
            document.getElementById('channelProfileName').textContent = channelName;
            document.getElementById('channelBigAvatar').textContent = channelName.charAt(0).toUpperCase();

            // 檢查會員狀態
            updateMembershipButtonUI();

            // 篩選該創作者的所有影片
            let channelVideos = getVideos().filter(v => v.channel === channelName);
            renderVideos(channelVideos, 'channelVideoGrid');
        }

        // 加入/取消頻道會員邏輯
        function toggleChannelMembership() {
            let memberships = getMemberships();
            if(!memberships[loggedInUser]) memberships[loggedInUser] = [];

            let index = memberships[loggedInUser].indexOf(viewingChannelName);
            if (index > -1) {
                memberships[loggedInUser].splice(index, 1);
                alert(`您已取消訂閱 ${viewingChannelName} 的頻道會員。`);
            } else {
                memberships[loggedInUser].push(viewingChannelName);
                alert(`🎉 恭喜您成功加入 ${viewingChannelName} 的頻道專屬會員！`);
            }
            saveMemberships(memberships);
            updateMembershipButtonUI();
        }

        function updateMembershipButtonUI() {
            let memberships = getMemberships();
            let isMember = memberships[loggedInUser] && memberships[loggedInUser].includes(viewingChannelName);
            
            let btn1 = document.getElementById('joinMemberBtn');
            let btn2 = document.getElementById('modalJoinBtn');

            [btn1, btn2].forEach(btn => {
                if (isMember) {
                    btn.textContent = "✓ 已加入頻道會員";
                    btn.classList.add('joined');
                } else {
                    btn.textContent = "加入頻道會員 🌟";
                    btn.classList.remove('joined');
                }
            });
        }

        function openLiveManager() {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById('homeContent').style.display = 'none';
            document.getElementById('channelProfilePanel').style.display = 'none';
            document.getElementById('liveManagerPanel').style.display = 'block';
            document.getElementById('managerAccountName').textContent = loggedInUser;

            let tbody = document.getElementById('managerTableBody');
            tbody.innerHTML = '';
            let videos = getVideos();
            let myLiveVids = videos.filter(v => v.isLive && v.channel === loggedInUser);

            if(myLiveVids.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">您目前沒有任何正在進行中的直播</td></tr>`;
                return;
            }

            myLiveVids.forEach(v => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${v.title}</b></td>
                        <td>${v.channel} (您自己)</td>
                        <td><span style="color:red; font-weight:bold;">🔴 直播中</span></td>
                        <td><button class="action-end-btn" onclick="managerEndLive(${v.id})">結束直播</button></td>
                    </tr>
                `;
            });
        }

        function managerEndLive(id) {
            if(confirm("確定要結束這場直播嗎？結束後將自動轉為回放影片供觀眾觀看。")) {
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }

                let videos = getVideos();
                let target = videos.find(v => v.id === id);
                if(target) {
                    target.isLive = false;
                    target.isVOD = true;
                    target.category = "回放";
                    target.views = "直播回放";
                    if (recordedBlobUrl) target.src = recordedBlobUrl;
                    else target.src = "https://www.w3schools.com/html/mov_bbb.mp4";
                    saveVideos(videos);
                }
                alert("🛑 直播已結束，已成功轉為回放影片！");
                openLiveManager();
            }
        }

        function openCreateModal() {
            let title = prompt("🎥 【上傳影片】請輸入標題：");
            if (title) {
                let thumb = prompt("🖼️ 請輸入縮圖的圖片網址 (可直接按確定使用預設)：") || "https://picsum.photos/300/160?random=" + Date.now();
                window.pendingTitle = title;
                window.pendingThumb = thumb;
                window.isLiveUpload = false;
                document.getElementById('fileInput').click();
            }
        }

        async function startLiveModal() {
            let title = prompt("📡 【開啟視窗分享直播】請輸入直播標題：");
            if (title) {
                let thumb = prompt("🖼️ 請輸入直播預覽縮圖的圖片網址 (可直接按確定)：") || "https://picsum.photos/300/160?random=" + Date.now();
                
                try {
                    activeWindowStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    
                    recordedChunks = [];
                    mediaRecorder = new MediaRecorder(activeWindowStream);
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                        recordedBlobUrl = URL.createObjectURL(blob);
                        let videos = getVideos();
                        let target = videos.find(v => v.id === window.currentLiveVidId);
                        if(target) { target.src = recordedBlobUrl; saveVideos(videos); }
                    };
                    mediaRecorder.start();

                    let newVidId = Date.now();
                    window.currentLiveVidId = newVidId;

                    let videos = getVideos();
                    let newVid = {
                        id: newVidId,
                        title: title,
                        category: "直播中",
                        channel: loggedInUser,
                        views: "1人在觀看 (直播中)",
                        isLive: true,
                        isVOD: false,
                        thumb: thumb,
                        isWindowShare: true,
                        src: "" 
                    };
                    videos.unshift(newVid);
                    saveVideos(videos);
                    renderVideos(videos);
                    alert('📡 視窗分享直播已成功啟動！');

                    activeWindowStream.getVideoTracks()[0].onended = function() {
                        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
                        newVid.isLive = false;
                        newVid.isVOD = true;
                        newVid.category = "回放";
                        newVid.views = "直播回放";
                        setTimeout(() => {
                            if(recordedBlobUrl) newVid.src = recordedBlobUrl;
                            saveVideos(videos);
                            renderVideos(getVideos());
                        }, 500);
                    };
                } catch (err) {
                    alert("您取消了視窗分享或瀏覽器不支援！");
                }
            }
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                let videos = getVideos();
                let newVid = {
                    id: Date.now(),
                    title: window.pendingTitle,
                    category: "遊戲",
                    channel: loggedInUser,
                    views: "剛剛",
                    isLive: false,
                    isVOD: false,
                    thumb: window.pendingThumb,
                    src: fileURL,
                    isWindowShare: false
                };
                videos.unshift(newVid);
                saveVideos(videos);
                renderVideos(videos);
                alert('影片與縮圖上傳成功！');
            }
        }

        async function openVideo(id) {
            let videos = getVideos();
            currentVideo = videos.find(item => item.id === id);
            if(currentVideo) {
                document.getElementById('modalTitle').textContent = currentVideo.title;
                document.getElementById('modalInfo').textContent = `${currentVideo.channel} • ${currentVideo.views}`;
                viewingChannelName = currentVideo.channel;
                updateMembershipButtonUI();
                
                let player = document.getElementById('modalVideoPlayer');
                let windowSharePlayer = document.getElementById('windowSharePlayer');

                if (currentVideo.isLive && currentVideo.isWindowShare && currentVideo.channel === loggedInUser && activeWindowStream) {
                    player.style.display = 'none';
                    windowSharePlayer.style.display = 'block';
                    windowSharePlayer.srcObject = activeWindowStream;

                    document.getElementById('chatSide').style.display = 'flex';
                    document.getElementById('commentsSection').style.display = 'none';
                    renderLiveChat();
                } else {
                    windowSharePlayer.style.display = 'none';
                    player.style.display = 'block';
                    document.getElementById('videoSource').src = currentVideo.src || "https://www.w3schools.com/html/mov_bbb.mp4";
                    player.load();

                    if (currentVideo.isLive) {
                        document.getElementById('chatSide').style.display = 'flex';
                        document.getElementById('commentsSection').style.display = 'none';
                        renderLiveChat();
                    } else {
                        document.getElementById('chatSide').style.display = 'none';
                        document.getElementById('commentsSection').style.display = 'block';
                        renderComments();
                    }
                }

                document.getElementById('videoModal').style.display = 'flex';
            }
        }

        function closeModal() {
            let player = document.getElementById('modalVideoPlayer');
            player.pause();
            document.getElementById('videoModal').style.display = 'none';
        }

        function renderLiveChat() {
            const box = document.getElementById('chatMessages');
            box.innerHTML = '';
            let chats = getChats();
            let msgs = chats[currentVideo.id] || [];
            msgs.forEach(m => { box.innerHTML += `<div><b>${m.user}:</b> ${m.text}</div>`; });
            box.scrollTop = box.scrollHeight;
        }

        function sendLiveChat() {
            let input = document.getElementById('chatInput');
            let text = input.value.trim();
            if(text) {
                let chats = getChats();
                if(!chats[currentVideo.id]) chats[currentVideo.id] = [];
                chats[currentVideo.id].push({ user: loggedInUser, text: text });
                saveChats(chats);
                input.value = '';
                renderLiveChat();
            }
        }

        function renderComments() {
            const list = document.getElementById('commentList');
            list.innerHTML = '';
            let comments = getComments();
            let comms = comments[currentVideo.id] || [];
            comms.forEach(c => { list.innerHTML += `<div class="comment-item"><b>${c.user}</b><br>${c.text}</div>`; });
        }

        function addComment() {
            let input = document.getElementById('commentInput');
            let text = input.value.trim();
            if(text) {
                let comments = getComments();
                if(!comments[currentVideo.id]) comments[currentVideo.id] = [];
                comments[currentVideo.id].push({ user: loggedInUser, text: text });
                saveComments(comments);
                input.value = '';
                renderComments();
            }
        }

        function filterCategory(cat, element) {
            document.querySelectorAll('.tag').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            let videos = getVideos();
            if (cat === '全部') renderVideos(videos);
            else if (cat === '直播中') renderVideos(videos.filter(v => v.isLive));
            else if (cat === '回放') renderVideos(videos.filter(v => v.isVOD));
            else renderVideos(videos.filter(v => v.category === cat));
        }

        function searchVideos() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let videos = getVideos();
            renderVideos(videos.filter(v => v.title.toLowerCase().includes(keyword)));
        }
    </script>
</body>
</html>
