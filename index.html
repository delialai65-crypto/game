<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尊榮席次預約 | 頂級領袖高峰會</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 60px 20px; background-color: #0f1115; color: #e5e7eb; line-height: 1.6;
        }
        .register-container {
            max-width: 520px; margin: 0 auto; background: #1a1c23;
            padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2d3748;
        }
        h2 { color: #d4af37; text-align: center; margin-top: 0; margin-bottom: 30px; letter-spacing: 1px; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #d1d5db; font-size: 0.95rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 14px; border: 1px solid #374151;
            border-radius: 4px; box-sizing: border-box; font-size: 1rem;
            background-color: #111318; color: #fff;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: #d4af37;
        }
        .submit-btn {
            background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
            color: #0f1115; border: none; width: 100%; padding: 15px;
            font-size: 1.1rem; font-weight: bold; border-radius: 4px; cursor: pointer;
            transition: all 0.3s; margin-top: 10px;
        }
        .submit-btn:hover { opacity: 0.9; }
        .back-link {
            display: block; text-align: center; margin-top: 25px;
            color: #9ca3af; text-decoration: none; font-size: 0.9rem;
        }
        .back-link:hover { color: #d4af37; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>席次預約表單</h2>
        <form>
            <div class="form-group">
                <label for="event-select">選擇尊榮場次：</label>
                <select id="event-select" required>
                    <option value="" disabled selected>-- 請選擇您的專屬梯次 --</option>
                    <option value="vip-taipei">09/10 台北場：全球趨勢與領袖思維（NT$ 6,800）</option>
                    <option value="vip-taichung">09/17 台中場：創新商業模式私董會（NT$ 6,800）</option>
                    <option value="vip-kaohsiung">09/24 高雄場：高階經理人美學沙龍（NT$ 6,800）</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">貴賓姓名：</label>
                <input type="text" id="name" placeholder="請輸入真實姓名或稱謂" required>
            </div>

            <div class="form-group">
                <label for="email">電子郵件：</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="phone">聯絡電話：</label>
                <input type="tel" id="phone" placeholder="0912-345-678" required>
            </div>

            <button type="submit" class="submit-btn">確認預約席次</button>
        </form>

        <a href="index.html" class="back-link">&larr; 返回高峰會主頁</a>
    </div>

</body>
</html>
